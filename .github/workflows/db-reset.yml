name: Reset do Banco Real

# ATENÇÃO: apaga TODOS os dados do banco sem volta.
# Uso permitido somente antes de existirem usuários reais. Ao liberar
# para usuários reais, desabilite este workflow no GitHub UI
# (Actions → Reset do Banco Real → Disable workflow).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite APAGAR-BANCO-REAL para confirmar"
        required: true
        type: string

concurrency:
  group: db-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: Limpar e migrar banco real
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Confirmar intenção e destino
        run: |
          test "${{ inputs.confirmar }}" = "APAGAR-BANCO-REAL" || {
            echo "Confirmação inválida. Digite exatamente APAGAR-BANCO-REAL."
            exit 1
          }
          case "$DATABASE_URL" in
            postgresql://*|postgres://*)
              echo "Destino é PostgreSQL, seguindo."
              ;;
            *)
              echo "Destino inválido (esperada URL postgresql://)."
              exit 1
              ;;
          esac
          case "$DATABASE_URL" in
            *@localhost*|*@127.0.0.1*|*/caderno*)
              echo "Destino parece local ou de teste; confira o secret."
              exit 1
              ;;
          esac

      - name: Repor banco (wipe + migrações)
        run: |
          node docker/postgres/repor.mjs
          node docker/app/migrar.mjs

      - name: Verificar estado final
        run: |
          node -e "
          import('pg').then(async ({ default: pg }) => {
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            const m = await c.query('select migration_name from public._prisma_migrations where rolled_back_at is null order by migration_name');
            console.log('migrações:', m.rows.map((r) => r.migration_name).join(','));
            const u = await c.query('select count(*)::int as n from public.usuarios');
            console.log('usuarios:', u.rows[0].n);
            if (m.rows.length === 0 || u.rows[0].n !== 0) process.exit(1);
            await c.end();
          });"

      - name: Smoke do isolamento
        run: npm run test:api
