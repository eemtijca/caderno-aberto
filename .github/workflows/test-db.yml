name: Testes de Banco

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Migrações, Isolamento e Contratos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caderno
          POSTGRES_PASSWORD: caderno
          POSTGRES_DB: caderno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caderno -d caderno"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrações
        run: node docker/app/migrar.mjs
        env:
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Testes de isolamento (RLS)
        run: npm run test:api
        env:
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Subir app para contratos
        run: |
          npm run build
          (npm run start -- -p 3000 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api > /dev/null && break
            sleep 4
          done
          curl -sf http://127.0.0.1:3000/api > /dev/null
        env:
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno
          AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
          EMAIL_DRIVER: log

      - name: Testes de contratos
        run: npm run test:contratos
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
