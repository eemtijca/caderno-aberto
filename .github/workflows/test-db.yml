name: Testes de Banco

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # Necessário para o cache GHA do build Docker.

jobs:
  testes:
    name: Migrações, Isolamento e Contratos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supre a interpolação obrigatória de compose.yml (o serviço app
    # recebe os mesmos valores via compose.ci.yml).
    env:
      AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
      CRON_SECRET: segredo-cron-dummy-de-32-bytes-para-ci00
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagem (com cache, valida o Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: caderno-aberto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Iniciar serviços
        run: |
          docker compose -f compose.yml -f compose.ci.yml up -d
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api > /dev/null && break
            sleep 4
          done
          curl -sf http://127.0.0.1:3000/api > /dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (clientes de teste)
        run: npm ci

      - name: Testes de isolamento (RLS)
        run: npm run test:api
        env:
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Testes de contratos
        run: npm run test:contratos
        env:
          TEST_BASE_URL: http://127.0.0.1:3000

      - name: Logs dos serviços (em falha)
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs

      - name: Derrubar serviços
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v
