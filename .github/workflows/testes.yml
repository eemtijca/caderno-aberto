# Sobe app e banco via Docker Compose e roda testes de isolamento e contratos.
# CI: roda apenas em pull requests.
name: Testes

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # Necessário para o cache GHA do build Docker.

jobs:
  testes:
    name: Migrações, Isolamento e Contratos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supre a interpolação obrigatória de compose.yml (o serviço app
    # recebe os mesmos valores via compose.ci.yml).
    env:
      AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
      CRON_SECRET: segredo-cron-dummy-de-32-bytes-para-ci00
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Construir imagem (com cache, valida o Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: caderno-aberto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Iniciar serviços
        run: |
          docker compose -f compose.yml -f compose.ci.yml up -d
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api > /dev/null && break
            sleep 4
          done
          curl -sf http://127.0.0.1:3000/api > /dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências (clientes de teste)
        run: pnpm install --frozen-lockfile

      - name: Testes de isolamento (RLS)
        run: pnpm run test:api
        env:
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Testes de contratos
        run: pnpm run test:contratos
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Testes de códigos e administração
        run: pnpm run test:codigos
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Testes de segurança e sessão
        run: pnpm run test:seguranca
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno

      - name: Instalar navegador (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes de ponta a ponta (Chromium)
        run: pnpm run test:e2e --project=chromium
        env:
          # localhost: o page.request do Playwright só envia o cookie Secure
          # do build de produção quando o host é tratado como local.
          TEST_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://caderno:caderno@localhost:5432/caderno
          AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

      - name: Logs dos serviços (em falha)
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs

      - name: Derrubar serviços
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v
