# Supabase local: orquestração de desenvolvimento. O app usa só o
# PostgreSQL direto (:54322) e o Storage via S3; o resto pode ficar
# desligado no dia a dia:
# supabase start --exclude gotrue,realtime,functions,imgproxy,postgrest,postgres-meta,edge-runtime,logflare,vector,supavisor
# (pooler parado; o modo direto é o usado). Studio segue ligado por conveniência.
project_id = "caderno-aberto"

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true
