# Caderno Aberto. Sobreposição do Compose somente para o CI (test-db.yml).
# Reaproveita compose.yml e adiciona apenas o necessário aos testes:
# segredos fictícios. As imagens usam o volume uploads:/data/imagens do
# compose base, sem ajustes manuais.
# ATENÇÃO: se compose.yml ganhar variável obrigatória nova, ela precisa
# ser espelhada aqui.
services:
  db:
    ports:
      - "5432:5432"
  app:
    # Imagem construída pelo passo de build do workflow (com cache).
    # O `up -d` sem `--build` a reaproveita; sem ela, o Compose compila.
    image: caderno-aberto:ci
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
      CRON_SECRET: segredo-cron-dummy-de-32-bytes-para-ci00
      # O Playwright acessa o app sem proxy, então todos os logins chegam com
      # o mesmo IP ("desconhecido"). O teto padrão de 30 por 5 minutos não
      # suporta a suíte de e2e; o teto por e-mail (AUTH_LIMITE_CODIGO) segue
      # no padrão para os testes de código.
      AUTH_LIMITE_TENTATIVAS: "1000"
