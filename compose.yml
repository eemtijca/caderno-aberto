# Caderno Aberto. Orquestração local: aplicação + PostgreSQL.
# Sobe tudo com: docker compose up --build
# A aplicação lê DATABASE_URL e aplica as migrações na partida.

name: caderno-aberto

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caderno
      POSTGRES_PASSWORD: caderno
      POSTGRES_DB: caderno
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderno -d caderno"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://caderno:caderno@db:5432/caderno
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-log}
      EMAIL_FROM: ${EMAIL_FROM:-Caderno Aberto <contato@exemplo.br>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      UPLOAD_DIR: /data/imagens
      STORAGE_DRIVER: disk
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
    volumes:
      - uploads:/data/imagens
    command: ["./docker/app/entrypoint.sh"]

volumes:
  pgdata:
  uploads:
